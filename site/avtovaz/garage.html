<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NIVA · просмотр модели</title>
<!--
  ПРОСМОТР МОДЕЛИ. Отдельная страница со сценой, вставляется в компред через <iframe>:
  у неё свой контекст WebGL и своё падение — без WebGL гаснет рамка, а не документ.

  СЦЕНА: машина стоит в гараже, камера ходит вокруг неё. Стены при этом ЗАКРЫВАЛИ БЫ
  обзор — угол поворота ограничивать не стали (это отбирает у человека главное действие),
  вместо этого стены РАСТВОРЯЮТСЯ, когда оказываются между камерой и машиной: у материала
  интерьера альфа считается по глубине в координатах камеры. Ближе порога — прозрачно,
  дальше — плотно. Так гараж виден со всех сторон, а машина не перекрывается никогда.

  ГЛАВНОЕ РЕШЕНИЕ ПО СВЕТУ. Первая версия освещала машину лампами «как в
  гараже», и это была ошибка: у модели metalness = 1, поверхность не красится светом, а
  ОТРАЖАЕТ окружение. Отражать нечего — и вместо кузова видно каждую складку сетки и
  каждый шов развёртки; именно этим модель выглядела «дефектной». В Meshy картинку даёт
  не лампа, а равномерное окружение (IBL). Здесь это повторено: сцена-студия (градиентный
  купол плюс четыре светящихся щита) прогоняется через PMREMGenerator и вешается на
  scene.environment. Материал модели не трогаем вовсе — он рассчитан ровно на такое
  окружение.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Фон — как на рендере Meshy: мягкий серый градиент, без пола и стен. Он в CSS, а не
     в сцене: так он остаётся плавным на любом экране и не стоит ни одного кадра. */
  html, body { height: 100%; margin: 0; overflow: hidden; color: #e9e9ea;
               font-family: "Roboto Mono", ui-monospace, monospace;
               background: radial-gradient(circle at 50% 44%, #4a4b50 0%, #34353a 40%, #222327 76%, #191a1c 100%); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  .hud { position: absolute; inset: auto 0 0 0; display: flex; align-items: flex-end; justify-content: space-between;
         gap: 18px; padding: 16px clamp(14px, 2.4vw, 28px); pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .plate { display: grid; gap: 4px; }
  .plate b { font: 700 clamp(17px, 2.2vw, 26px)/1 Oswald, "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; }
  .plate span { color: #a9a9ac; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }

  .switch { display: flex; border: 1px solid rgba(233,233,234,.3); border-radius: 2px; overflow: hidden; }
  .switch button { min-width: 48px; padding: 11px 13px; border: 0; background: rgba(20,20,22,.42); color: #c9c9cc; cursor: pointer;
                   font: 600 13px/1 Oswald, "Roboto Mono", monospace; letter-spacing: .12em; }
  .switch button + button { border-left: 1px solid rgba(233,233,234,.3); }
  .switch button[aria-pressed="true"] { background: #e9e9ea; color: #17181a; }

  .hint { position: absolute; left: clamp(14px, 2.4vw, 28px); top: clamp(14px, 2.4vw, 24px);
          color: #9c9c9f; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
  .loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center; z-index: 5;
             background: radial-gradient(circle at 50% 44%, #4a4b50 0%, #34353a 40%, #222327 76%, #191a1c 100%); transition: opacity .5s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading i { display: block; width: 170px; height: 2px; background: rgba(233,233,234,.2); position: relative; }
  .loading i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: #e9e9ea; transition: width .2s; }
  .loading p { margin: 0; color: #9c9c9f; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
  .fallback { max-width: 320px; text-align: center; color: #b6b6b9; font-size: 12px; line-height: 1.55; letter-spacing: .03em; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <p class="hint">Тяните, чтобы повернуть</p>

  <div class="hud">
    <div class="plate">
      <b id="plateName">NIVA · экспедиция</b>
      <span id="plateNote">Кенгурятник, багажник, люстра</span>
    </div>
    <div class="switch" id="models">
      <button type="button" data-model="models/niva-a.glb" data-name="NIVA · экспедиция" data-note="Кенгурятник, багажник, люстра" aria-pressed="true">1</button>
      <button type="button" data-model="models/car-cruiser.glb" data-name="NIVA · круизер" data-note="Городская сборка" aria-pressed="false">2</button>
      <button type="button" data-model="models/car-castrol.glb" data-name="NIVA · ралли" data-note="Раллийная ливрея" aria-pressed="false">3</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <i id="bar"></i>
    <p id="loadNote">Загрузка модели</p>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script>
  (function () {
    'use strict';
    var DEV = /[?&]dev=1/.test(location.search);   // отладка: габариты и масштабы в консоль
    var canvas = document.getElementById('stage');
    var loading = document.getElementById('loading');
    var bar = document.getElementById('bar');

    if (!window.THREE) { fail('Не удалось загрузить движок сцены.'); return; }
    var renderer;
    try {
      /* alpha: true — фон рисует CSS-градиент: он плавный на любом экране и не зависит
         от тонового преобразования сцены. */
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    } catch (e) { fail('Браузер не поддерживает WebGL.'); return; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    /* Тени включаем: без них машина «наклеена» на пол, а сцена читается плоской.
       PCFSoft — мягкий край, как от лампы через плафон, а не бритвенно резкий. */
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

    /* ── СТУДИЙНОЕ ОКРУЖЕНИЕ ────────────────────────────────────────────────
       Купол и четыре щита — это весь свет сцены. Щиты РАЗНОЙ яркости не для красоты:
       при равных получается плоская «пластиковая» картинка, где не читается ни один
       изгиб кузова. Верхний — главный, боковой слабее, задний узкий и яркий рисует
       блик по ребру крыши, нижний почти чёрный: без него низ машины засвечен так же,
       как верх, и она теряет вес — выглядит вырезанной из бумаги. */
    function studioEnvironment() {
      var env = new THREE.Scene();
      env.add(new THREE.Mesh(
        new THREE.SphereGeometry(12, 24, 16),
        new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x8f9196 })
      ));
      function panel(w, h, x, y, z, k) {
        var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k) }));
        m.position.set(x, y, z);
        m.lookAt(0, 0, 0);
        env.add(m);
      }
      panel(9, 9, 0, 7.5, 1.5, 3.6);       // верхний софтбокс
      panel(7, 5, -6.5, 2.5, 4.5, 1.6);    // заполняющий слева-спереди
      panel(6, 2.4, 4.5, 3.6, -5.5, 2.8);  // контровой справа-сзади
      panel(12, 8, 0, -6, 0, 0.10);        // тёмный низ
      return env;
    }

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    scene.environment = pmrem.fromScene(studioEnvironment(), 0.04).texture;

    /* Тонкая направленная подсветка поверх окружения: даёт резкий блик на лаке,
       которого у чистого IBL не бывает. Тени выключены сознательно — на рендере Meshy
       машина стоит без тени, а любая тень тут же выдаёт отсутствие пола. */
    /* ── СВЕТ СЦЕНЫ ─────────────────────────────────────────────────────────
       Окружение (IBL) даёт объём и отражения, но не даёт НАПРАВЛЕНИЯ: без него нет
       ни блика по ребру крыла, ни тени на полу, и кадр выглядит пресным.
       Три источника, у каждого своя работа:
         • ключевой — сверху-сбоку, единственный, кто отбрасывает тень;
         • контровой холодный сзади — отделяет кузов от тёмной стены;
         • тёплая подсветка снизу-спереди — вытягивает бампер и решётку из черноты. */
    var key = new THREE.DirectionalLight(0xfff2dd, 2.1);
    key.position.set(4.2, 7.5, 5.0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0009;          // без сдвига по тени идёт «зебра» самозатенения
    key.shadow.normalBias = 0.02;
    key.shadow.radius = 3;
    var sc = key.shadow.camera;         // рамка тени охватывает машину, а не всю комнату:
    sc.left = -4; sc.right = 4;         // чем меньше рамка, тем крупнее пиксель карты теней
    sc.top = 4; sc.bottom = -4;
    sc.near = 1; sc.far = 22;
    scene.add(key, key.target);

    var rimBack = new THREE.DirectionalLight(0x9db8ff, 1.15);
    rimBack.position.set(-5.5, 3.2, -6);
    scene.add(rimBack);

    var fillWarm = new THREE.DirectionalLight(0xffb27a, 0.55);
    fillWarm.position.set(-2.5, 0.9, 5.5);
    scene.add(fillWarm);

    /* ── ИНТЕРЬЕР ГАРАЖА ────────────────────────────────────────────────────
       Растворение по глубине: фрагмент тем прозрачнее, чем ближе он к камере.
       Порог и полоса перехода заданы в единицах сцены и пересчитываются от габарита
       машины, а не константами — иначе на другой модели стены исчезнут целиком.
       depthWrite выключен: полупрозрачная стена, пишущая глубину, срезала бы машину
       за собой прямоугольной дырой. */
    var roomRoot = new THREE.Group();
    scene.add(roomRoot);
    var roomUniforms = { uFade: { value: 3.2 }, uBand: { value: 1.6 }, uFloorY: { value: 0.35 } };

    function patchRoom(mat) {
      /* Прозрачность здесь НЕ ГОДИТСЯ, и это выяснилось на первой же сборке: у
         полупрозрачных поверхностей своя очередь отрисовки, и пол гаража лёг белёсой
         плёнкой поверх колёс. Поэтому стены не «полупрозрачные», а РАССЫПАЮТСЯ:
         пиксель либо рисуется целиком, либо отбрасывается по шумовому порогу
         (упорядоченный дизеринг). Глубина при этом честная, сортировать нечего. */
      mat.transparent = false;
      mat.depthWrite = true;
      mat.side = THREE.DoubleSide;      // изнутри комнаты видна изнанка стен
      mat.onBeforeCompile = function (shader) {
        shader.uniforms.uFade = roomUniforms.uFade;
        shader.uniforms.uBand = roomUniforms.uBand;
        shader.uniforms.uFloorY = roomUniforms.uFloorY;
        shader.vertexShader = shader.vertexShader
          .replace('void main() {', 'varying float vViewDepth;\nvarying float vWorldY;\nvoid main() {')
          .replace('#include <project_vertex>',
                   '#include <project_vertex>\nvViewDepth = -mvPosition.z;\nvWorldY = (modelMatrix * vec4(transformed, 1.0)).y;');
        shader.fragmentShader = shader.fragmentShader
          .replace('void main() {', [
            'uniform float uFade;',
            'uniform float uBand;',
            'varying float vViewDepth;',
            'varying float vWorldY;',
            'uniform float uFloorY;',
            /* Шум по координате пикселя: узор мелкий и в движении не «плывёт» по стене */
            'float roomHash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
            'void main() {',
            /* Пол не рассыпаем: он лежит НИЖЕ линии взгляда и обзору не мешает, а
               рассыпающийся под колёсами пол читается как брак картинки. */
            '  float roomKeep = smoothstep(uFade, uFade + uBand, vViewDepth);',
            '  if (vWorldY > uFloorY && roomKeep < roomHash(gl_FragCoord.xy)) discard;'
          ].join('\n'));
      };
      mat.needsUpdate = true;
    }

    /* ПЯТНО ПОД МАШИНОЙ. Настоящих теней в сцене нет (свет даёт окружение), и без
       контактного пятна машина «висит» над полом — глаз читает это мгновенно, даже
       не понимая причины. Пятно рисуется градиентом на текстуре: одна плоскость дешевле
       любой карты теней и не зависит от направления света. */
    function contactShadow(size) {
      var c = document.createElement('canvas');
      c.width = c.height = 128;
      var g = c.getContext('2d');
      var grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
      grad.addColorStop(0, 'rgba(0,0,0,.62)');
      grad.addColorStop(.55, 'rgba(0,0,0,.28)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
      var tex = new THREE.CanvasTexture(c);
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(size * 1.25, size * 0.62),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.02;      // чуть выше пола, иначе плоскости мерцают друг сквозь друга
      m.renderOrder = 1;
      return m;
    }

    /* ── МОДЕЛЬ ─────────────────────────────────────────────────────────────*/
    var carRoot = new THREE.Group();
    scene.add(carRoot);
    var shadow = null;

    var loader = new THREE.GLTFLoader();
    var current = 'models/niva-a.glb';
    var spin = 0.19;

    function clear() {
      for (var i = carRoot.children.length - 1; i >= 0; i--) {
        carRoot.children[i].traverse(function (n) { if (n.isMesh) n.geometry.dispose(); });
        carRoot.remove(carRoot.children[i]);
      }
    }

    function load(url) {
      loading.classList.remove('done');
      bar.style.setProperty('--p', '0%');
      loader.load(url, function (gltf) {
        clear();
        place(gltf.scene);
        loading.classList.add('done');
      }, function (e) {
        if (e.lengthComputable) bar.style.setProperty('--p', Math.round(e.loaded / e.total * 100) + '%');
      }, function () { fail('Не удалось загрузить модель.'); });
    }

    /* Интерьер грузится один раз и живёт независимо от переключения машин.
       Масштаб считается ОТ МАШИНЫ: у комнаты и у модели свои единицы, и «подогнать
       на глаз» означает, что при смене машины гараж окажется кукольным или гигантским. */
    var roomLoaded = false;
    function loadRoom(carHeight) {
      if (roomLoaded) return;
      roomLoaded = true;
      loader.load('models/garage.glb', function (gltf) {
        var root = gltf.scene;
        var maxAniso = renderer.capabilities.getMaxAnisotropy();
        root.traverse(function (o) {
          if (!o.isMesh || !o.material) return;
          if (o.material.map) { o.material.map.anisotropy = maxAniso; o.material.map.needsUpdate = true; }
          patchRoom(o.material);
          o.receiveShadow = true;      // пол и стены принимают тень машины
          o.castShadow = false;        // но сами не отбрасывают: стены рассыпаются, и тень от них мигала бы
        });
        var box = new THREE.Box3().setFromObject(root);
        var size = new THREE.Vector3(), center = new THREE.Vector3();
        box.getSize(size); box.getCenter(center);
        /* Считаем по ВЫСОТЕ: у гаража главное — потолок над машиной (примерно два её
           роста). По длине комната у этой модели почти квадратная, и подгонка по длине
           давала зал 18 на 18 единиц вокруг пятиметровой машины — не гараж, а ангар. */
        var k = (carHeight * 2.1) / size.y;
        root.scale.setScalar(k);
        root.position.set(-center.x * k, -box.min.y * k, -center.z * k);
        roomRoot.add(root);
        if (DEV) console.log('гараж:', size, 'масштаб', k.toFixed(3));
      }, undefined, function () { /* без интерьера сцена остаётся студийной — это не поломка */ });
    }

    function place(root) {
      /* Материал НЕ ТРОГАЕМ: он рассчитан на окружение, и правка металличности или
         шероховатости уводит вид от исходного рендера. Задаём только анизотропию карты —
         без неё рисунок «кипит» на скошенных панелях. */
      var maxAniso = renderer.capabilities.getMaxAnisotropy();
      root.traverse(function (o) {
        if (!o.isMesh || !o.material) return;
        if (o.material.map) { o.material.map.anisotropy = maxAniso; o.material.map.needsUpdate = true; }
        o.material.side = THREE.FrontSide;
        o.castShadow = true;
        o.receiveShadow = true;        // тень от крыла ложится на капот и порог
      });

      var box = new THREE.Box3().setFromObject(root);
      var size = new THREE.Vector3(), center = new THREE.Vector3();
      box.getSize(size); box.getCenter(center);

      /* Постоянный размер и центр в начале координат: модели приходят в разных
         масштабах, а кадр обязан быть одинаковым при переключении вариантов. */
      var scale = 2.4 / size.y;
      root.scale.setScalar(scale);
      root.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      carRoot.add(root);

      /* Габарит запоминаем: дистанция пересчитывается ещё и на каждом resize —
         рамка на странице широкая, а на телефоне высокая и узкая, и одна и та же
         дистанция даёт там обрезанную машину. */
      fit.w = Math.max(size.x, size.z) * scale;
      fit.h = size.y * scale;
      fitCamera();

      /* Машина стоит НА ПОЛУ гаража, а не висит в центре координат: пол комнаты — y = 0,
         поэтому модель поднимаем на половину своей высоты. */
      carRoot.position.y = fit.h / 2;
      key.target.position.set(0, fit.h * 0.5, 0);
      key.target.updateMatrixWorld();
      if (shadow) scene.remove(shadow);
      shadow = contactShadow(fit.w);
      scene.add(shadow);
      orbit.target.set(0, fit.h * 0.52, 0);
      /* Полоса перехода задаётся один раз, а сам порог считается каждый кадр в цикле:
         он равен расстоянию до машины минус её радиус. Всё, что ближе, — рассыпается. */
      roomUniforms.uBand.value = fit.w * 0.18;
      roomUniforms.uFloorY.value = fit.h * 0.16;   // всё, что ниже колёсных арок, — пол
      loadRoom(fit.h);
      updateCamera();
    }

    /* ── КАМЕРА ─────────────────────────────────────────────────────────────*/
    var orbit = { az: 2.35, el: 0.22, dist: 6.4, target: new THREE.Vector3(0, 1.2, 0) };
    var fit = { w: 4.6, h: 2.4 };

    /* Дистанция считается ПО ОБОИМ углам обзора. Вертикальный угол задан камерой,
       горизонтальный зависит от пропорций рамки; если считать только по ширине модели,
       на узком экране машина вылезает за кадр сверху и снизу. Множитель 1.18 — поля
       вокруг машины, как на исходном рендере. */
    function fitCamera() {
      var fovV = camera.fov * Math.PI / 180;
      var fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
      var dV = (fit.h / 2) / Math.tan(fovV / 2);
      var dH = (fit.w / 2) / Math.tan(fovH / 2);
      orbit.dist = Math.max(dV, dH) * 1.62 + 0.6;
      updateCamera();
    }
    function updateCamera() {
      var ce = Math.cos(orbit.el), se = Math.sin(orbit.el);
      camera.position.set(Math.cos(orbit.az) * ce * orbit.dist, se * orbit.dist, Math.sin(orbit.az) * ce * orbit.dist);
      camera.lookAt(orbit.target);
    }

    var drag = null;
    canvas.addEventListener('pointerdown', function (e) {
      drag = { x: e.clientX, y: e.clientY };
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drag) return;
      orbit.az -= (e.clientX - drag.x) * 0.006;
      orbit.el = Math.max(0.03, Math.min(0.8, orbit.el + (e.clientY - drag.y) * 0.004));
      drag.x = e.clientX; drag.y = e.clientY;
      spin = 0;                                   // человек взял управление — автоповорот стоп
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      canvas.addEventListener(ev, function () { drag = null; canvas.classList.remove('dragging'); });
    });
    /* Колесо мыши без Shift НЕ перехватываем: иначе рамка съедает прокрутку страницы
       и документ застревает на сцене. */
    canvas.addEventListener('wheel', function (e) {
      if (!e.shiftKey) return;
      e.preventDefault();
      orbit.dist = Math.max(3.6, Math.min(12, orbit.dist + e.deltaY * 0.004));
    }, { passive: false });

    document.getElementById('models').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-model]');
      if (!b || b.dataset.model === current) return;
      [].forEach.call(this.children, function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      current = b.dataset.model;
      document.getElementById('plateName').textContent = b.dataset.name;
      document.getElementById('plateNote').textContent = b.dataset.note;
      load(current);
    });

    function resize() {
      var w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      fitCamera();
    }
    addEventListener('resize', resize);

    var t0 = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
      orbit.az += spin * dt;
      /* Рассыпаем всё, что оказалось между камерой и машиной: порог идёт за камерой,
         поэтому колонна, стена или стеллаж исчезают ровно тогда, когда лезут в кадр. */
      roomUniforms.uFade.value = Math.max(0.35, orbit.dist - fit.w * 0.62);
      updateCamera();
      renderer.render(scene, camera);
    }

    function fail(msg) {
      loading.innerHTML = '<p class="fallback">' + msg + '<br>Кадры игры показаны ниже на странице.</p>';
      loading.classList.remove('done');
    }

    resize();
    load(current);
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
