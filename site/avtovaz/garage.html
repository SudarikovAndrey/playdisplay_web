<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NIVA · просмотр модели</title>
<!--
  ПРОСМОТР МОДЕЛИ. Отдельная страница со сценой, вставляется в компред через <iframe>:
  у неё свой контекст WebGL и своё падение — без WebGL гаснет рамка, а не документ.

  ГЛАВНОЕ РЕШЕНИЕ ЭТОЙ СТРАНИЦЫ — СВЕТ. Первая версия освещала машину лампами «как в
  гараже», и это была ошибка: у модели metalness = 1, поверхность не красится светом, а
  ОТРАЖАЕТ окружение. Отражать нечего — и вместо кузова видно каждую складку сетки и
  каждый шов развёртки; именно этим модель выглядела «дефектной». В Meshy картинку даёт
  не лампа, а равномерное окружение (IBL). Здесь это повторено: сцена-студия (градиентный
  купол плюс четыре светящихся щита) прогоняется через PMREMGenerator и вешается на
  scene.environment. Материал модели не трогаем вовсе — он рассчитан ровно на такое
  окружение.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Фон — как на рендере Meshy: мягкий серый градиент, без пола и стен. Он в CSS, а не
     в сцене: так он остаётся плавным на любом экране и не стоит ни одного кадра. */
  html, body { height: 100%; margin: 0; overflow: hidden; color: #e9e9ea;
               font-family: "Roboto Mono", ui-monospace, monospace;
               background: radial-gradient(circle at 50% 44%, #4a4b50 0%, #34353a 40%, #222327 76%, #191a1c 100%); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  .hud { position: absolute; inset: auto 0 0 0; display: flex; align-items: flex-end; justify-content: space-between;
         gap: 18px; padding: 16px clamp(14px, 2.4vw, 28px); pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .plate { display: grid; gap: 4px; }
  .plate b { font: 700 clamp(17px, 2.2vw, 26px)/1 Oswald, "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; }
  .plate span { color: #a9a9ac; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }

  .switch { display: flex; border: 1px solid rgba(233,233,234,.3); border-radius: 2px; overflow: hidden; }
  .switch button { min-width: 48px; padding: 11px 13px; border: 0; background: rgba(20,20,22,.42); color: #c9c9cc; cursor: pointer;
                   font: 600 13px/1 Oswald, "Roboto Mono", monospace; letter-spacing: .12em; }
  .switch button + button { border-left: 1px solid rgba(233,233,234,.3); }
  .switch button[aria-pressed="true"] { background: #e9e9ea; color: #17181a; }

  .hint { position: absolute; left: clamp(14px, 2.4vw, 28px); top: clamp(14px, 2.4vw, 24px);
          color: #9c9c9f; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
  .loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center; z-index: 5;
             background: radial-gradient(circle at 50% 44%, #4a4b50 0%, #34353a 40%, #222327 76%, #191a1c 100%); transition: opacity .5s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading i { display: block; width: 170px; height: 2px; background: rgba(233,233,234,.2); position: relative; }
  .loading i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: #e9e9ea; transition: width .2s; }
  .loading p { margin: 0; color: #9c9c9f; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
  .fallback { max-width: 320px; text-align: center; color: #b6b6b9; font-size: 12px; line-height: 1.55; letter-spacing: .03em; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <p class="hint">Тяните, чтобы повернуть</p>

  <div class="hud">
    <div class="plate">
      <b id="plateName">NIVA · вариант 1</b>
      <span id="plateNote">Тюнинг: кенгурятник, багажник, фары</span>
    </div>
    <div class="switch" id="models">
      <button type="button" data-model="models/niva-a.glb" data-name="NIVA · вариант 1" data-note="Тюнинг: кенгурятник, багажник, фары" aria-pressed="true">1</button>
      <button type="button" data-model="models/niva-b.glb" data-name="NIVA · вариант 2" data-note="Заниженная, роспись по кузову" aria-pressed="false">2</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <i id="bar"></i>
    <p id="loadNote">Загрузка модели</p>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script>
  (function () {
    'use strict';
    var canvas = document.getElementById('stage');
    var loading = document.getElementById('loading');
    var bar = document.getElementById('bar');

    if (!window.THREE) { fail('Не удалось загрузить движок сцены.'); return; }
    var renderer;
    try {
      /* alpha: true — фон рисует CSS-градиент: он плавный на любом экране и не зависит
         от тонового преобразования сцены. */
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    } catch (e) { fail('Браузер не поддерживает WebGL.'); return; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

    /* ── СТУДИЙНОЕ ОКРУЖЕНИЕ ────────────────────────────────────────────────
       Купол и четыре щита — это весь свет сцены. Щиты РАЗНОЙ яркости не для красоты:
       при равных получается плоская «пластиковая» картинка, где не читается ни один
       изгиб кузова. Верхний — главный, боковой слабее, задний узкий и яркий рисует
       блик по ребру крыши, нижний почти чёрный: без него низ машины засвечен так же,
       как верх, и она теряет вес — выглядит вырезанной из бумаги. */
    function studioEnvironment() {
      var env = new THREE.Scene();
      env.add(new THREE.Mesh(
        new THREE.SphereGeometry(12, 24, 16),
        new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x8f9196 })
      ));
      function panel(w, h, x, y, z, k) {
        var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k) }));
        m.position.set(x, y, z);
        m.lookAt(0, 0, 0);
        env.add(m);
      }
      panel(9, 9, 0, 7.5, 1.5, 3.6);       // верхний софтбокс
      panel(7, 5, -6.5, 2.5, 4.5, 1.6);    // заполняющий слева-спереди
      panel(6, 2.4, 4.5, 3.6, -5.5, 2.8);  // контровой справа-сзади
      panel(12, 8, 0, -6, 0, 0.10);        // тёмный низ
      return env;
    }

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    scene.environment = pmrem.fromScene(studioEnvironment(), 0.04).texture;

    /* Тонкая направленная подсветка поверх окружения: даёт резкий блик на лаке,
       которого у чистого IBL не бывает. Тени выключены сознательно — на рендере Meshy
       машина стоит без тени, а любая тень тут же выдаёт отсутствие пола. */
    var key = new THREE.DirectionalLight(0xffffff, 0.5);
    key.position.set(3.5, 6, 4.5);
    scene.add(key);

    /* ── МОДЕЛЬ ─────────────────────────────────────────────────────────────*/
    var carRoot = new THREE.Group();
    scene.add(carRoot);

    var loader = new THREE.GLTFLoader();
    var current = 'models/niva-a.glb';
    var spin = 0.19;

    function clear() {
      for (var i = carRoot.children.length - 1; i >= 0; i--) {
        carRoot.children[i].traverse(function (n) { if (n.isMesh) n.geometry.dispose(); });
        carRoot.remove(carRoot.children[i]);
      }
    }

    function load(url) {
      loading.classList.remove('done');
      bar.style.setProperty('--p', '0%');
      loader.load(url, function (gltf) {
        clear();
        place(gltf.scene);
        loading.classList.add('done');
      }, function (e) {
        if (e.lengthComputable) bar.style.setProperty('--p', Math.round(e.loaded / e.total * 100) + '%');
      }, function () { fail('Не удалось загрузить модель.'); });
    }

    function place(root) {
      /* Материал НЕ ТРОГАЕМ: он рассчитан на окружение, и правка металличности или
         шероховатости уводит вид от исходного рендера. Задаём только анизотропию карты —
         без неё рисунок «кипит» на скошенных панелях. */
      var maxAniso = renderer.capabilities.getMaxAnisotropy();
      root.traverse(function (o) {
        if (!o.isMesh || !o.material) return;
        if (o.material.map) { o.material.map.anisotropy = maxAniso; o.material.map.needsUpdate = true; }
        o.material.side = THREE.FrontSide;
      });

      var box = new THREE.Box3().setFromObject(root);
      var size = new THREE.Vector3(), center = new THREE.Vector3();
      box.getSize(size); box.getCenter(center);

      /* Постоянный размер и центр в начале координат: модели приходят в разных
         масштабах, а кадр обязан быть одинаковым при переключении вариантов. */
      var scale = 2.4 / size.y;
      root.scale.setScalar(scale);
      root.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      carRoot.add(root);

      /* Габарит запоминаем: дистанция пересчитывается ещё и на каждом resize —
         рамка на странице широкая, а на телефоне высокая и узкая, и одна и та же
         дистанция даёт там обрезанную машину. */
      fit.w = Math.max(size.x, size.z) * scale;
      fit.h = size.y * scale;
      fitCamera();
    }

    /* ── КАМЕРА ─────────────────────────────────────────────────────────────*/
    var orbit = { az: 2.35, el: 0.30, dist: 6.4, target: new THREE.Vector3(0, 0, 0) };
    var fit = { w: 4.6, h: 2.4 };

    /* Дистанция считается ПО ОБОИМ углам обзора. Вертикальный угол задан камерой,
       горизонтальный зависит от пропорций рамки; если считать только по ширине модели,
       на узком экране машина вылезает за кадр сверху и снизу. Множитель 1.18 — поля
       вокруг машины, как на исходном рендере. */
    function fitCamera() {
      var fovV = camera.fov * Math.PI / 180;
      var fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
      var dV = (fit.h / 2) / Math.tan(fovV / 2);
      var dH = (fit.w / 2) / Math.tan(fovH / 2);
      orbit.dist = Math.max(dV, dH) * 1.18 + 0.5;
      updateCamera();
    }
    function updateCamera() {
      var ce = Math.cos(orbit.el), se = Math.sin(orbit.el);
      camera.position.set(Math.cos(orbit.az) * ce * orbit.dist, se * orbit.dist, Math.sin(orbit.az) * ce * orbit.dist);
      camera.lookAt(orbit.target);
    }

    var drag = null;
    canvas.addEventListener('pointerdown', function (e) {
      drag = { x: e.clientX, y: e.clientY };
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drag) return;
      orbit.az -= (e.clientX - drag.x) * 0.006;
      orbit.el = Math.max(-0.12, Math.min(0.85, orbit.el + (e.clientY - drag.y) * 0.004));
      drag.x = e.clientX; drag.y = e.clientY;
      spin = 0;                                   // человек взял управление — автоповорот стоп
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      canvas.addEventListener(ev, function () { drag = null; canvas.classList.remove('dragging'); });
    });
    /* Колесо мыши без Shift НЕ перехватываем: иначе рамка съедает прокрутку страницы
       и документ застревает на сцене. */
    canvas.addEventListener('wheel', function (e) {
      if (!e.shiftKey) return;
      e.preventDefault();
      orbit.dist = Math.max(3.6, Math.min(12, orbit.dist + e.deltaY * 0.004));
    }, { passive: false });

    document.getElementById('models').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-model]');
      if (!b || b.dataset.model === current) return;
      [].forEach.call(this.children, function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      current = b.dataset.model;
      document.getElementById('plateName').textContent = b.dataset.name;
      document.getElementById('plateNote').textContent = b.dataset.note;
      load(current);
    });

    function resize() {
      var w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      fitCamera();
    }
    addEventListener('resize', resize);

    var t0 = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
      carRoot.rotation.y += spin * dt;
      updateCamera();
      renderer.render(scene, camera);
    }

    function fail(msg) {
      loading.innerHTML = '<p class="fallback">' + msg + '<br>Кадры игры показаны ниже на странице.</p>';
      loading.classList.remove('done');
    }

    resize();
    load(current);
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
