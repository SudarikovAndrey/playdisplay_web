<!-- @dsCard group="Site" viewport="1440x900" name="Work — 3D Spatial Index (игровой)" subtitle="Портфолио внутри 3D-мира: радар, lock-on, разведка" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayDisplay — Work / Spatial Index</title>
<!-- Из поиска убрана 21.08.2026: страница техническая (встраивается в лендинг /
     прототип), но Яндекс обходил её как самостоятельную — и каждый ?v=<версия>
     считался отдельным адресом с тем же title. Отсюда «дублирующиеся title»
     в Вебмастере. Лечится noindex, а не Disallow: Disallow запретил бы читать
     сам noindex, и уже проиндексированное осталось бы в выдаче. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Onest:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #030c10; overflow-x: hidden; }
  :root { --teal:#2be0c6; --amber:#ff6a3d; --white:#dceef0; --void:#030c10; --line:rgba(220,238,240,0.14); }
  #scene { position: fixed; inset: 0; border: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 0; }
  .rotze { position: fixed; top: 0; left: 0; right: 0; height: 100vh; z-index: 3; cursor: grab; }
  .rotze:active { cursor: grabbing; }
  .hero-space { height: 100vh; }
  .index { position: relative; z-index: 4; background: linear-gradient(180deg, transparent, var(--void) 12%, var(--void)); padding: 40px 44px 120px; }
  .index .head2 { font: 500 11px 'Roboto Mono'; letter-spacing: .2em; text-transform: uppercase; color: rgba(220,238,240,0.5); margin-bottom: 8px; }
  .index .row { display: grid; grid-template-columns: 60px 1fr auto; gap: 24px; align-items: center; padding: 26px 0; border-top: 1px solid var(--line); cursor: pointer; transition: background .2s; }
  .index .row:hover { background: rgba(43,224,198,0.05); }
  .index .row .ri { font: 400 13px 'Roboto Mono'; color: var(--white); opacity: .5; }
  .index .row .rn { font: 700 clamp(20px,2.2vw,30px) 'Unbounded'; color: #F1FBFC; letter-spacing: -0.01em; }
  .index .row .rt { font: 500 10.5px 'Roboto Mono'; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
  .hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; font-family: 'Roboto Mono', monospace; color: var(--white); transition: opacity .4s; }
  .hud.dim { opacity: 0; }
  .grade { position: fixed; inset: 0; z-index: 2; pointer-events: none; background:
    radial-gradient(900px 700px at 12% 92%, rgba(3,12,16,0.85), transparent 60%),
    linear-gradient(180deg, rgba(3,12,16,0.5) 0%, transparent 20%, transparent 68%, rgba(3,12,16,0.75) 100%); }

  .topbar { position: absolute; top: 34px; left: 44px; right: 44px; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { display: flex; flex-direction: column; gap: 8px; }
  .brand .logo { font: 800 15px 'Unbounded'; letter-spacing: .1em; color: #fff; }
  .brand .sub { font: 400 10.5px 'Roboto Mono'; letter-spacing: .24em; color: var(--teal); }
  .discovered { text-align: right; }
  .discovered .n { font: 700 30px 'Unbounded'; color: #fff; letter-spacing: -0.02em; }
  .discovered .l { font: 400 10px 'Roboto Mono'; letter-spacing: .2em; text-transform: uppercase; color: rgba(220,238,240,0.5); margin-top: 4px; }

  /* radar */
  .radar { position: absolute; top: 92px; right: 44px; width: 168px; height: 168px; }
  .radar .idxc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .radar .idxc b { font: 800 26px 'Unbounded'; color: #fff; letter-spacing: -0.02em; }
  .radar .idxc span { font: 400 9px 'Roboto Mono'; letter-spacing: .2em; color: rgba(220,238,240,0.5); }

  /* dossier */
  .dossier { position: absolute; left: 44px; bottom: 44px; max-width: 460px; }
  .dossier .task { display: inline-block; font: 500 10.5px 'Roboto Mono'; letter-spacing: .14em; text-transform: uppercase; color: var(--void); background: var(--amber); padding: 5px 11px; margin-bottom: 16px; }
  .dossier h1 { font: 700 clamp(30px,4vw,52px)/0.98 'Unbounded'; letter-spacing: -0.02em; color: #F1FBFC; text-shadow: 0 4px 40px rgba(3,12,16,0.9); }
  .dossier .stats { display: flex; gap: 26px; margin-top: 20px; }
  .dossier .stats .v { font: 400 15px 'Roboto Mono'; color: var(--teal); }
  .dossier .stats .k { margin-top: 4px; font: 400 9.5px 'Roboto Mono'; letter-spacing: .12em; text-transform: uppercase; color: rgba(220,238,240,0.5); }
  .enter { pointer-events: auto; margin-top: 26px; display: inline-flex; align-items: center; gap: 11px; cursor: pointer;
    font: 700 13px 'Blender Pro','Unbounded'; letter-spacing: .14em; text-transform: uppercase; color: var(--void);
    background: var(--white); border: none; padding: 15px 24px;
    clip-path: polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    opacity: .4; transform: translateY(0); transition: opacity .3s, background .3s, box-shadow .3s; }
  .enter.armed { opacity: 1; background: var(--amber); box-shadow: 0 0 28px rgba(255,106,61,0.5); }
  .enter .k { font-family: 'Roboto Mono'; font-weight: 400; font-size: 10px; opacity: .7; }

  /* lock reticle (center) */
  .lock { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; transform: translate(-50%,-50%) scale(1.15); opacity: 0; transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); }
  .lock.on { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .lock i { position: absolute; width: 30px; height: 30px; border: 2px solid var(--teal); }
  .lock .a { top: 0; left: 0; border-right: none; border-bottom: none; }
  .lock .b { top: 0; right: 0; border-left: none; border-bottom: none; }
  .lock .c { bottom: 0; left: 0; border-right: none; border-top: none; }
  .lock .d { bottom: 0; right: 0; border-left: none; border-top: none; }
  .lock em { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); font: 400 10px 'Roboto Mono'; letter-spacing: .28em; color: var(--teal); text-transform: uppercase; }

  .hint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); font: 400 10.5px 'Roboto Mono'; letter-spacing: .2em; text-transform: uppercase; color: rgba(220,238,240,0.55); text-align: center; }
  .hint b { color: var(--teal); font-weight: 400; }

  /* case overlay */
  .case { position: fixed; inset: 0; z-index: 20; background: rgba(3,12,16,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .case.open { opacity: 1; pointer-events: auto; }
  .case .box { width: min(760px,90vw); border: 1px solid var(--line); background: #0b1e25; }
  .case .m { aspect-ratio: 16/9; background: #071319; }
  .case .m iframe { width: 100%; height: 100%; border: 0; }
  .case .b { padding: 28px 32px 34px; }
  .case .b h2 { font: 700 30px 'Unbounded'; color: #fff; }
  .case .b p { margin-top: 12px; font: 400 15px/1.6 'Onest'; color: rgba(220,238,240,0.75); }
  .case .x { position: absolute; top: 26px; right: 30px; width: 44px; height: 44px; border: 1px solid var(--line); background: rgba(3,12,16,0.5); color: #fff; font-size: 18px; cursor: pointer; }

  @media (max-width: 900px){
    .radar { width: 120px; height: 120px; top: 84px; right: 20px; }
    .topbar { left: 20px; right: 20px; top: 20px; }
    .dossier { left: 20px; right: 20px; bottom: 24px; max-width: none; }
    #scene { pointer-events: none; }
  }
</style>
</head>
<body>
<iframe id="scene" src="hero-scene.html" title="PlayDisplay 3D"></iframe>
<div class="grade"></div>
<div class="rotze" id="rotze"></div>
<div class="hero-space"></div>
<section class="index"><div class="head2">Все проекты — 11</div><div id="rows"></div></section>

<div class="hud">
  <div class="topbar">
    <div class="brand"><span class="logo">PLAYDISPLAY</span><span class="sub">WORK // SPATIAL INDEX</span></div>
    <div class="discovered"><div class="n"><span id="disc">0</span>/<span id="tot">11</span></div><div class="l">разведано</div></div>
  </div>

  <div class="radar">
    <svg viewBox="0 0 168 168" width="168" height="168">
      <circle cx="84" cy="84" r="76" fill="none" stroke="rgba(220,238,240,0.14)"/>
      <circle cx="84" cy="84" r="52" fill="none" stroke="rgba(220,238,240,0.08)"/>
      <g id="nodes"></g>
      <line id="sweep" x1="84" y1="84" x2="84" y2="8" stroke="var(--teal)" stroke-width="1.5" opacity="0.7"/>
    </svg>
    <div class="idxc"><b id="rnum">01</b><span>/ 11</span></div>
  </div>

  <div class="lock" id="lock"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><em>lock</em></div>

  <div class="dossier">
    <span class="task" id="d-task">—</span>
    <h1 id="d-title">—</h1>
    <div class="stats" id="d-stats"></div>
    <button class="enter" id="enter"><span>▶ Enter scene</span> <span class="k" id="enterk">наведись</span></button>
  </div>

  <div class="hint">Свайп / скролл — <b>лететь по кольцу</b> · остановись на проекте — <b>lock</b> · Enter — войти</div>
</div>

<div class="case" id="case">
  <button class="x" id="caseX">✕</button>
  <div class="box"><div class="m" id="caseM"></div><div class="b"><h2 id="caseT"></h2><p id="caseP"></p></div></div>
</div>

<script>
  var P = [
    { t:"Рассказать", n:"ВДНХ Космос", s:[["115","тачскринов"],["46","3D-модели"]], v:["vimeo","397688406"], d:"Вся история космонавтики — играбельная система: 115 тачскринов и интерактивные 3D-модели кораблей и станций." },
    { t:"Продать сложное", n:"BMW X5", s:[["VR","режим"],["Holo","витрина"]], v:["vimeo","414266169"], d:"Кастомизатор авто: VR, тачскрин и голограмма. Собери свой X5 и увидь его глазами водителя." },
    { t:"Удивить", n:"Стенд МИГ-35", s:[["15 м","LED"],["3D","контент"]], v:["youtube","YVteDZL90qc"], d:"Сцена для истребителя на авиасалоне: подиум, 15-метровый LED-экран и 3D-контент." },
    { t:"Рассказать", n:"Панорама 360", s:[["360°","AR"],["Live","среда"]], v:["vimeo","412364504"], d:"Дополненная реальность 360°: зритель оказывается внутри сцены." },
    { t:"Рассказать", n:"Сталинград", s:[["Свет","звук"],["1","история"]], v:["youtube","IVmCylimRmY"], d:"Мультимедийная инсталляция памяти: историю проживаешь, а не читаешь." },
    { t:"Продать сложное", n:"Синара", s:[["Holo","узлы"],["3D","разбор"]], v:["youtube","lfmqw20YzlY"], d:"Голограммы и интерактив для транспортного машиностроения." },
    { t:"Продать сложное", n:"Сухой порт COALCO", s:[["3D","модель"],["Live","данные"]], v:["youtube","6ZBMB54713E"], d:"Логистический хаб как живая 3D-модель: масштаб считывается с одного взгляда." },
    { t:"Продать сложное", n:"PTK Group", s:[["Live","стенд"],["1","сценарий"]], v:["vimeo","522723089"], d:"Интерактивный корпоративный стенд для переговоров и выставок." },
    { t:"Рассказать", n:"Космонавтика и авиация", s:[["XXL","комплекс"],["Live","среда"]], v:["vimeo","397679197"], d:"Единая мультимедийная среда крупнейшего музейного комплекса авиации и космонавтики." },
    { t:"Продать сложное", n:"ОДК ОАК", s:[["Holo","двигатели"],["0","слов"]], v:["youtube","jgoiEkCIfgQ"], d:"Авиадвигателестроение на МАКС: голограммы двигателей и разбор технологий без слов." },
    { t:"Удивить", n:"Прорыв", s:[["Atom","цикл"],["Live","сим"]], v:["youtube","bSNki6_F898"], d:"«Росатом»: замкнутый ядерный топливный цикл как наглядный зрелищный интерактив." }
  ];
  var N = P.length, cur = 0, locked = false, seen = new Set();

  // radar nodes
  var ns = document.getElementById('nodes');
  for (var i=0;i<N;i++){ var a = (i/N)*Math.PI*2 - Math.PI/2;
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', 84 + Math.cos(a)*76); c.setAttribute('cy', 84 + Math.sin(a)*76);
    c.setAttribute('r', 3.4); c.setAttribute('fill','rgba(220,238,240,0.35)'); c.dataset.i = i;
    ns.appendChild(c);
  }
  var nodeEls = [].slice.call(ns.children);

  function fmtN(x){ return String(x+1).padStart(2,'0'); }
  function render(){
    var p = P[cur];
    document.getElementById('d-task').textContent = p.t;
    document.getElementById('d-title').textContent = p.n;
    document.getElementById('d-stats').innerHTML = p.s.map(function(s){return '<div><div class="v">'+s[0]+'</div><div class="k">'+s[1]+'</div></div>';}).join('');
    document.getElementById('rnum').textContent = fmtN(cur);
    var a = (cur/N)*360; document.getElementById('sweep').setAttribute('transform','rotate('+a+' 84 84)');
    nodeEls.forEach(function(el,i){
      el.setAttribute('fill', i===cur ? 'var(--amber)' : (seen.has(i) ? 'var(--teal)' : 'rgba(220,238,240,0.35)'));
      el.setAttribute('r', i===cur ? 5 : 3.4);
    });
    document.getElementById('disc').textContent = seen.size;
    var enter = document.getElementById('enter');
    enter.classList.toggle('armed', locked);
    document.getElementById('enterk').textContent = locked ? 'готово' : 'наведись';
    document.getElementById('lock').classList.toggle('on', locked);
  }
  render();

  addEventListener('message', function(e){
    var d = e.data || {};
    if (typeof d.pdIdx === 'number' && d.pdIdx !== cur) { cur = d.pdIdx; if (locked) locked=false; render(); }
    if (typeof d.pdLock === 'number') { locked = !!d.pdLock; if (locked) seen.add(cur); render(); }
  });

  // enter → case overlay with video
  function openCase(){
    var p = P[cur];
    var m = p.v[0]==='vimeo' ? 'https://player.vimeo.com/video/'+p.v[1]+'?title=0&byline=0&portrait=0'
                             : 'https://www.youtube.com/embed/'+p.v[1]+'?rel=0&modestbranding=1';
    document.getElementById('caseM').innerHTML = '<iframe src="'+m+'" allow="autoplay; fullscreen" allowfullscreen></iframe>';
    document.getElementById('caseT').textContent = p.n;
    document.getElementById('caseP').textContent = p.d;
    document.getElementById('case').classList.add('open');
  }
  function closeCase(){ document.getElementById('case').classList.remove('open'); document.getElementById('caseM').innerHTML=''; }
  document.getElementById('enter').addEventListener('click', openCase);
  document.getElementById('caseX').addEventListener('click', closeCase);
  document.getElementById('case').addEventListener('click', function(e){ if(e.target===this) closeCase(); });
  addEventListener('keydown', function(e){ if(e.key==='Escape') closeCase(); });

  // index rows (scroll target below the 3D hero)
  var rowsEl = document.getElementById('rows');
  P.forEach(function(p,i){
    var r = document.createElement('div'); r.className='row';
    r.innerHTML = '<div class="ri">'+fmtN(i)+'</div><div><div class="rn">'+p.n+'</div></div><div class="rt">'+p.t+'</div>';
    r.addEventListener('click', function(){ cur=i; seen.add(i); render(); openCase(); });
    rowsEl.appendChild(r);
  });

  // fade HUD once you scroll past the 3D hero
  addEventListener('scroll', function(){ document.querySelector('.hud').classList.toggle('dim', scrollY > innerHeight*0.5); }, {passive:true});

  // gesture router over the hero: horizontal drag/swipe rotates the scene,
  // vertical scroll/drag scrolls the page (сцена больше не перехватывает скролл).
  var frame = document.getElementById('scene');
  function rotate(dx){ if (frame && frame.contentWindow) frame.contentWindow.postMessage({ pdRotate: -dx * 0.007 }, '*'); }
  var rz = document.getElementById('rotze');
  // mouse drag (desktop)
  var down=false, mx=0;
  rz.addEventListener('mousedown', function(e){ down=true; mx=e.clientX; });
  addEventListener('mousemove', function(e){ if(!down) return; rotate(e.clientX-mx); mx=e.clientX; });
  addEventListener('mouseup', function(){ down=false; });
  // touch: axis-lock (horizontal→rotate, vertical→page scroll)
  var x0=0,y0=0,ax=null;
  rz.addEventListener('touchstart', function(e){ var t=e.touches[0]; x0=t.clientX; y0=t.clientY; ax=null; }, {passive:true});
  rz.addEventListener('touchmove', function(e){ var t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(ax===null && (Math.abs(dx)>6||Math.abs(dy)>6)) ax = Math.abs(dx)>Math.abs(dy)?'h':'v';
    if(ax==='h'){ e.preventDefault(); rotate(dx); x0=t.clientX; y0=t.clientY; }
  }, {passive:false});
</script>
</body>
</html>
