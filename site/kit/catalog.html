<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Конструктор презентаций · живой каталог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Roboto+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Порядок обязателен: layout задаёт токены и сетку, дальше типографика, компоненты
       и анимации. scrub.css нужен только страницам с крутилкой. -->
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/scrub.css">
  <style>
    /* Оформление САМОГО каталога. Оно живёт только здесь и в готовые страницы не уходит:
       это инструмент, а не блок конструктора. */
    .kb-shell { width: var(--page); margin: 0 auto; padding: 132px 0 160px; }
    .kb-lead h1 { font: 800 clamp(34px, 4.4vw, 66px)/.98 'Unbounded', sans-serif; letter-spacing: -.04em; margin: 0 0 18px; }
    .kb-lead p { max-width: 760px; color: var(--muted); margin: 0 0 12px; }
    .kb-lead ol { max-width: 760px; color: var(--muted); padding-left: 22px; }
    .kb-status { display: inline-block; margin-top: 18px; padding: 9px 14px; border: 1px solid var(--line); color: var(--paper); font: 500 11px/1 'Roboto Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
    .kb-group { margin-top: clamp(70px, 9vw, 130px); }
    .kb-group > h2 { font: 600 12px/1 'Roboto Mono', monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--electric); margin: 0 0 26px; }
    .kb-card { margin: 0 0 46px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
    .kb-card__head { padding: 26px 28px 20px; border-bottom: 1px solid var(--line); }
    .kb-card__head h3 { font: 600 clamp(19px, 1.9vw, 26px)/1.15 'Unbounded', sans-serif; letter-spacing: -.02em; margin: 0 0 10px; }
    .kb-id { display: block; margin-bottom: 10px; color: #64798c; font: 500 10.5px/1 'Roboto Mono', monospace; letter-spacing: .2em; text-transform: uppercase; }
    .kb-what { margin: 0; color: var(--muted); max-width: 820px; }
    .kb-stage { position: relative; overflow: hidden; padding: 30px 28px; border-bottom: 1px solid var(--line); background: #05070c; }
    .kb-stage--tight { padding: 0; }
    .kb-stage--tall { min-height: 420px; }
    .kb-note { padding: 18px 28px; border-bottom: 1px solid var(--line); color: #8f9bb2; font: 400 12.5px/1.5 'Roboto Mono', monospace; }
    .kb-code { border-bottom: 1px solid var(--line); }
    .kb-code summary { padding: 14px 28px; cursor: pointer; color: var(--muted); font: 500 11px/1 'Roboto Mono', monospace; letter-spacing: .18em; text-transform: uppercase; }
    .kb-code pre { margin: 0; padding: 0 28px 22px; overflow-x: auto; color: #cfe0ff; font: 400 12px/1.55 'Roboto Mono', monospace; white-space: pre-wrap; }
    .kb-meta { display: grid; gap: 18px; padding: 22px 28px 26px; }
    .kb-meta h4 { margin: 0 0 8px; color: #8f9bb2; font: 500 10.5px/1 'Roboto Mono', monospace; letter-spacing: .2em; text-transform: uppercase; }
    .kb-meta ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
    .kb-meta .kb-traps li { color: #e7d6bd; }
    .kb-files code { color: #cfe0ff; font: 400 12px 'Roboto Mono', monospace; }
    .kb-demo-ball { display: block; width: 320px; height: 320px; margin: auto; }
    .kb-mini { position: relative; height: 300px; overflow: hidden; border: 1px solid var(--line); }
    .kb-mini .boot { position: absolute; }
    @media (max-width: 680px) { .kb-shell { width: calc(100vw - 40px); padding-top: 92px; } .kb-stage { padding: 18px 14px; } }
  </style>
</head>
<body>
  <!-- Каркасные блоки (шапка, полоса разделов, прогресс, курсор, кнопка «в начало»)
       живут не в карточках, а работают на самой странице каталога: увидеть их можно
       прямо сейчас, а разметку взять из карточки. -->
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="cursor-core" aria-hidden="true"></div>
  <div class="brand-particles" id="brandParticles" aria-hidden="true"></div>
  <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>

  <header class="masthead">
    <a class="playdisplay-logo playdisplay-logo--top" href="#top" data-brand-logo aria-label="В начало"><img src="assets/demo/logo.webp" alt="Playdisplay"></a>
    <div class="book-mark"><span>Presentation kit</span><span>Каталог · 0.1</span></div>
  </header>

  <nav class="chapter-nav" id="kbNav" aria-label="Разделы каталога"></nav>

  <main id="top">
    <div class="kb-shell">
      <section class="kb-lead">
        <h1>Конструктор<br>презентаций</h1>
        <p id="kbAbout"></p>
        <ol id="kbHow"></ol>
        <span class="kb-status" id="kbStatus">проверяю опись…</span>
      </section>
      <div id="kbGroups"></div>
    </div>
  </main>

  <button class="to-top" id="toTop" type="button" aria-label="Вернуться в начало"><i></i><span>В начало</span></button>

  <!-- ======================= ДЕМОНСТРАЦИИ =======================
       Разметка внутри [data-demo] — настоящая. Каталог сам печатает её в блоке
       «Разметка», поэтому показанный код не может разойтись с показанным видом. -->
  <template id="kbDemos">

    <div data-block="boot">
      <div class="kb-mini">
        <div class="boot" style="opacity:1;visibility:visible">
          <div class="boot-inner">
            <img class="boot-logo" src="assets/demo/logo.webp" alt="">
            <div class="boot-bar"><i style="width:62%"></i></div>
            <p class="boot-note">Название · версия</p>
          </div>
        </div>
      </div>
    </div>

    <div data-block="masthead" data-live="Работает на этой странице — шапка сверху."></div>
    <div data-block="side-nav" data-live="Работает на этой странице — полоса разделов слева."></div>
    <div data-block="progress" data-live="Работает на этой странице — линия под шапкой."></div>
    <div data-block="to-top" data-live="Работает на этой странице — кнопка в правом нижнем углу."></div>
    <div data-block="smooth-scroll" data-live="Работает на этой странице: прокрутите колесом мыши."></div>
    <div data-block="app-lock" data-live="Работает на этой странице: текст не выделяется, картинки не тянутся."></div>
    <div data-block="cursor-dot" data-live="Работает на этой странице — курсор-точка со свечением."></div>
    <div data-block="cursor-ball" data-live="Живой пример — в книге «Музей Мяча» на экранах «Мяч — проводник» и «Контакты»."></div>
    <div data-block="hero-3d" data-live="Живой пример — первый экран playdisplay.com."></div>
    <div data-block="flygl" data-live="Живой пример — переход в кейс на playdisplay.com."></div>

    <div data-block="sound">
      <button class="sound-toggle is-playing" type="button" aria-pressed="true"><i aria-hidden="true"></i><span>Звук / вкл</span></button>
    </div>

    <div data-block="hero-ball">
      <canvas class="kb-demo-ball" id="ballCanvas" aria-hidden="true"></canvas>
    </div>

    <div data-block="hero-visual">
      <figure class="hero-visual" style="height:340px;margin:0">
        <img src="assets/demo/frame.webp" alt="Пример кадра">
      </figure>
    </div>

    <div data-block="xray">
      <figure class="hero-visual" style="height:340px;margin:0" id="kbXray">
        <img src="assets/demo/frame.webp" alt="Пример кадра">
        <img class="xray-layer" src="assets/demo/frame-xray.webp" alt="" aria-hidden="true">
      </figure>
    </div>

    <div data-block="hero-intro">
      <div class="hero-copy" style="width:100%">
        <p class="overline hero-overline">Vision document · версия 0.1</p>
        <h1 style="font-size:clamp(34px,5vw,74px)"><span class="l1">ПЕРВАЯ</span><span class="l2">СТРОКА</span></h1>
        <p class="hero-statement hero-statement--float">Играй. Исследуй. Возвращайся.</p>
      </div>
      <p class="hero-status">Статус документа: основа для согласования. Не является техническим заданием.</p>
      <a class="scroll-cue" href="#top" style="position:static;margin-top:24px"><span>Начать</span><i></i></a>
    </div>

    <div data-block="opening-statement">
      <section class="opening-statement" style="min-height:0;margin:0;padding:40px 0">
        <p class="is-visible">Мяч – проводник.</p>
        <p class="is-visible">Главный герой – человек.</p>
      </section>
    </div>

    <div data-block="chapter">
      <header class="chapter-header" style="margin-bottom:30px">
        <span class="chapter-number">07</span>
        <span class="chapter-rule"></span>
        <span class="chapter-meta">Vision / 0.1</span>
      </header>
      <article class="chapter-copy" style="width:100%;margin:0">
        <h2 style="font-size:clamp(26px,3vw,44px)">Название главы</h2>
        <h3>Подзаголовок</h3>
        <p>Абзац основного текста: колонка ограничена по ширине, чтобы строка читалась.</p>
      </article>
    </div>

    <div data-block="pull">
      <p class="pull" style="margin:0">Мысль, которую нужно вынести из абзаца.</p>
    </div>

    <div data-block="clean-list">
      <ul class="clean-list">
        <li>1. Вызов – задача считается за несколько секунд.</li>
        <li>2. Действие – тридцать секунд настоящего опыта.</li>
        <li>3. Разбор – система показывает результат.</li>
      </ul>
    </div>

    <div data-block="courts" data-live="Живой пример — текстовые главы книги «Музей Мяча»: разметка появляется под текстом и складывается по прокрутке."></div>

    <div data-block="art-frame">
      <figure class="art-frame" style="margin:0">
        <div class="art-surface art-surface--image" style="min-height:280px">
          <img src="assets/demo/frame.webp" alt="Пример кадра">
          <span class="art-index">INDEX / 01</span>
        </div>
        <figcaption>Подпись кадра одной строкой<span>Имя кадра</span></figcaption>
      </figure>
    </div>

    <div data-block="art-fullscreen" data-live="Живой пример — кадры во всю ширину в книге. Внутри карточки вылет из колонки показать нельзя: он считается от настоящего положения родителя."></div>

    <div data-block="art-motion">
      <figure class="art-frame" style="margin:0">
        <div class="art-surface art-surface--image art-surface--video" style="min-height:280px">
          <video src="assets/demo/motion.mp4" muted loop playsinline preload="metadata"></video>
          <span class="art-index">MOTION</span>
        </div>
        <figcaption>Ролик вместо картинки: без звука, играет только в кадре<span>Иллюстрация</span></figcaption>
      </figure>
    </div>

    <div data-block="hotspots">
      <figure class="art-frame" style="margin:0">
        <div class="art-surface art-surface--image" style="min-height:300px">
          <img src="assets/demo/frame.webp" alt="Пример кадра"
               data-spots='[{"x":50,"y":50,"r":2.8,"t":"Сферический светодиодный экран"},{"x":50,"y":10,"r":2.8,"t":"Купол со сферической проекцией"}]'>
        </div>
        <figcaption>Наведите на точку<span>Подсказки</span></figcaption>
      </figure>
    </div>

    <div data-block="scrub">
      <div class="v-media v-scrub" style="height:320px">
        <video src="assets/demo/motion.mp4" preload="none" playsinline muted></video>
        <div class="sc-bar"><div class="sc-knob"><i>←</i><span>Тяните</span></div></div>
        <div class="sc-hint">Потяните, чтобы прокрутить кадры</div>
      </div>
    </div>

    <div data-block="radar">
      <div class="radar-stage">
        <svg class="radar-plot" viewBox="0 0 400 400" aria-hidden="true">
          <g class="radar-grid">
            <circle cx="200" cy="200" r="40"/><circle cx="200" cy="200" r="80"/>
            <circle cx="200" cy="200" r="120"/><circle cx="200" cy="200" r="160" class="radar-edge"/>
            <path d="M200 200 L200 40 M200 200 L313.14 86.86 M200 200 L360 200 M200 200 L313.14 313.14 M200 200 L200 360 M200 200 L86.86 313.14 M200 200 L40 200 M200 200 L86.86 86.86"/>
          </g>
          <polygon class="radar-shape" points="200,81.6 292.8,107.2 308.8,200 287.1,287.1 200,297.6 120.8,279.2 96,200 110.6,110.6"/>
          <circle class="radar-hub" cx="200" cy="200" r="3"/>
        </svg>
        <div class="radar-label radar-label--n"><span>Скорость</span><b>74</b></div>
        <div class="radar-label radar-label--ne"><span>Точность</span><b>82</b></div>
        <div class="radar-label radar-label--e"><span>Тактика</span><b>68</b></div>
        <div class="radar-label radar-label--se"><span>Команда</span><b>77</b></div>
        <div class="radar-label radar-label--s"><span>Сила</span><b>61</b></div>
        <div class="radar-label radar-label--sw"><span>Баланс</span><b>70</b></div>
        <div class="radar-label radar-label--w"><span>Выносливость</span><b>65</b></div>
        <div class="radar-label radar-label--nw"><span>Лидерство</span><b>79</b></div>
      </div>
    </div>

    <div data-block="stats-grid">
      <div class="stats-grid">
        <div class="stat-line"><b>27 000</b><span>точек в облаке</span></div>
        <div class="stat-line"><b>4 с</b><span>смена вида спорта</span></div>
        <div class="stat-line"><b>15 %</b><span>высоты экрана — курсор</span></div>
      </div>
    </div>

    <div data-block="flow-diagram">
      <div class="flow-diagram">
        <div>Вход</div><i></i><div>Выбор</div><i></i><div>Действие</div><i></i><div>Возврат</div>
      </div>
    </div>

    <div data-block="concept-cards">
      <div class="concept-cards">
        <article class="concept-card"><span>01</span><h4>Название идеи</h4><p>Короткое пояснение в одну-две строки.</p></article>
        <article class="concept-card"><span>02</span><h4>Вторая идея</h4><p>Короткое пояснение в одну-две строки.</p></article>
        <article class="concept-card"><span>03</span><h4>Третья идея</h4><p>Короткое пояснение в одну-две строки.</p></article>
      </div>
    </div>

    <div data-block="journey">
      <div class="diagram journey-diagram">
        <div><b>01</b><span>Вход</span></div><div><b>02</b><span>Выбор</span></div>
        <div><b>03</b><span>Действие</span></div><div><b>04</b><span>Профиль</span></div>
        <div><b>05</b><span>Возврат</span></div>
      </div>
    </div>

    <div data-block="collection">
      <div class="diagram collection-diagram">
        <div><b>01</b><span>Личный рекорд</span></div><div><b>02</b><span>Командная победа</span></div>
        <div><b>03</b><span>Редкий навык</span></div><div><b>04</b><span>Сезонный трофей</span></div>
      </div>
    </div>

    <div data-block="final-credits">
      <footer class="final-credits" style="min-height:0;margin:0;padding:48px 28px">
        <div class="final-credits__main">
          <div class="final-credits__director">
            <img src="assets/demo/portrait.webp" alt="">
            <p><span>Креативный директор</span><strong>Имя Фамилия</strong></p>
          </div>
        </div>
        <span class="final-credits__index">Название / версия</span>
      </footer>
    </div>

  </template>

  <script defer src="js/catalog.js"></script>
  <script defer src="js/reveal-cursor.js"></script>
  <script defer src="js/nav.js"></script>
  <script defer src="js/parallax.js"></script>
  <script defer src="js/lists.js"></script>
  <script defer src="js/hotspots.js"></script>
  <script defer src="js/xray.js"></script>
  <script defer src="js/ball.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/scrub.js"></script>
</body>
</html>
