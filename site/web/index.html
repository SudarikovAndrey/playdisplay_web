<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06070a">
  <!-- Витрина черновиков в поиске не нужна: сырой прототип в выдаче работает против
       студии. Страница открыта всем, кому дали ссылку, но не индексируется. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Прототипы на вебе · playdisplay</title>
  <link rel="icon" href="/assets/logos/favicon-32.png" sizes="32x32">
  <!-- Шрифты СВОИ, а не с Google Fonts: site/ самодостаточен и наружу не ходит. -->
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <script src="/analytics.js" defer></script>
  <!-- Из кита взяты только токены, типографика и карточки. Обвязка документа
       (заставка, боковая навигация, разделы, полоса прочитанного) СНЯТА: здесь
       не книга и не презентация, а одна галерея. Лишние слои её только удлиняли. -->
  <link rel="stylesheet" href="../kit/css/layout.css?v=74ee8427">
  <link rel="stylesheet" href="../kit/css/typography.css?v=720384aa">
  <link rel="stylesheet" href="../kit/css/components.css?v=b32076ac">
  <style>
    /* Страница-галерея: своя короткая раскладка вместо каркаса документа. */
    body { background: var(--black); color: var(--paper); }
    .wrap { width: var(--page); max-width: 1240px; margin: 0 auto; padding: 46px 0 90px; }
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
           padding-bottom: 30px; border-bottom: 1px solid var(--line); }
    .top img { height: 19px; display: block; }
    .top .count { font: 500 10px/1 'Roboto Mono', monospace; letter-spacing: .2em;
                  text-transform: uppercase; color: var(--muted); }
    .lead { margin: 34px 0 0; max-width: 62ch; font-size: 15px; line-height: 1.65; color: var(--muted); }
    .lead b { color: var(--paper); font-weight: 500; }
    @media (max-width: 700px) { .wrap { width: calc(100vw - 36px); padding: 28px 0 60px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a href="/" aria-label="playdisplay"><img src="/assets/logos/playdisplay-logo-white.png" alt="playdisplay"></a>
      <span class="count" id="protoCount">—</span>
    </header>

    <p class="lead"><b>Прототипы на вебе.</b> Всё, что студия собрала и выложила в сеть.
       Каждая карточка ведёт на живой адрес — не на макет и не на видео. Превью снято
       с самой страницы, поэтому устаревает вместе с ней. Закрытые проекты открываются
       по паролю, у каждого свой.</p>

    <div class="proto-grid" id="protoGrid"></div>

  </div>

  <script>
  /* ===== СПИСОК ПРОТОТИПОВ =====================================================
     Одна запись — один живой адрес. Добавить прототип стоит одной строки: если бы
     это была разметка на карточку, витрину перестали бы пополнять на третьей.

     Состояния карточки три:
       open: true            — открыт, ведём прямо на адрес;
       open: false           — закрыт, пятно вместо кадра и переход к паролю;
       url отсутствует       — адреса ещё нет, карточка не кликается.

     ПОЧЕМУ У ЗАКРЫТЫХ НЕТ КАДРА. Соблазн велик: снять настоящую страницу и размыть.
     Так нельзя. Размытие в CSS — оформление, а не защита: файл лежит целиком, его
     достают и «сохранить изображение», и прямой ссылкой, а по размытому кадру
     читаются вёрстка и фирменный стиль заказчика. Поэтому рисуется пятно в цвете
     проекта, а настоящее название видно уже за паролем. */
  /* СЕЙЧАС ПОКАЗЫВАЕМ ПЯТЬ. Остальные не удалены, а СПРЯТАНЫ полем hidden:
     вернуть карточку — снять одно слово, а не собирать её заново вместе с превью.
     Их кадры так и лежат в shots/ по той же причине. */
  var PROTOS = [
    { url:'/immersive/',    shot:'shots/immersive.jpg',    kind:'Презентация',  when:'2026', open:true,
      title:'MR One', desc:'Иммерсивная комната как инструмент продаж: сценарии, экраны, свет.' },
    // Превью снято с живого dev-сервера соседнего воркtree: WebGPU поднимается
    // только с GPU, поэтому кадр брался Chrome без --disable-gpu и с ANGLE/Metal.
    {                       shot:'shots/mare.jpg',         kind:'WebGPU-опыт',  when:'не опубликован', open:true, tint:'#2f7fa8',
      title:'MARÉ · океан', desc:'Вода на three/webgpu и шейдерах WGSL: якорная стоянка, облёт, свободный полёт.' },
    { url:'/boxingcartel/', shot:'shots/boxingcartel.jpg', kind:'Бренд',        when:'2026', open:true,
      title:'Boxing Cartel', desc:'Монохромный combatwear-бренд: дисциплина, которую носят в чёрном.' },
    { url:'https://sudarikov.space/',       shot:'shots/sudarikov.jpg', kind:'Арт-архив', when:'внешний', open:true,
      title:'sudarikov.space', desc:'Архив «Gravity and Desire»: 68 работ — рисунок, цифровое искусство, умозрительные пространства.' },
    { url:'https://sudarikov.space/world/', shot:'shots/world.jpg',     kind:'Портфолио', when:'внешний', open:true,
      title:'sudarikov.space · world', desc:'Интерактивное портфолио: работы разложены по трёхмерному миру, по нему ходят.' },

    { hidden:true, url:'/digital/',  shot:'shots/digital.jpg',  kind:'Лендинг',    when:'2026', open:true,
      title:'Цифровой слой', desc:'Интерактивная среда вокруг продукта, события, места, человека или идеи.' },
    { hidden:true, url:'/library/',  shot:'shots/library.jpg',  kind:'Справочник', when:'2026', open:true,
      title:'Библиотека оборудования', desc:'65 типов техники: что каждая умеет и обо что спотыкаются на второй год.' },
    { hidden:true, url:'/layer/',    shot:'shots/layer.jpg',    kind:'AI-помощник',when:'2026', open:true,
      title:'Сперотон AR', desc:'Голосовой помощник: о продукте, составе, применении и мужском здоровье.' },
    { hidden:true, url:'/ai-pack/',  shot:'shots/ai-pack.jpg',  kind:'Предложение',when:'2026', open:true,
      title:'AI Pack', desc:'QR на упаковке открывает диалог с продуктом.' },
    { hidden:true, url:'/akvion/',   shot:'shots/akvion.jpg',   kind:'Предложение',when:'2026', open:true,
      title:'AI Pack · светлая версия', desc:'То же предложение в светлой теме.' },
    { hidden:true, url:'/avtovaz/',  kind:'Компред',   when:'под паролем', open:false, tint:'#c8a24a',
      title:'Закрытый проект', desc:'Коммерческое предложение автомобильному бренду.' },
    { hidden:true, url:'/ball/',     kind:'Концепция', when:'под паролем', open:false, tint:'#2be0c6',
      title:'Закрытый проект', desc:'Концепция музея, свёрстанная книгой.' }
  ];


  (function(){
    function esc(s){
      return String(s).replace(/[&<>"]/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
      });
    }
    var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'
      + '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    var grid = document.getElementById('protoGrid');
    // Спрятанные не рисуем вовсе: они остаются в списке, чтобы вернуть карточку
    // можно было снятием одного слова.
    var SHOWN = PROTOS.filter(function(p){ return !p.hidden; });
    grid.innerHTML = SHOWN.map(function(p){
      var ext = p.url && /^https?:/.test(p.url);
      var shot;
      if (!p.open) {
        shot = '<span class="proto-shot proto-shot--blur"></span>'
             + '<span class="proto-lock">' + LOCK + 'под паролем</span>';
      } else if (p.shot) {
        shot = '<span class="proto-shot"><img src="' + esc(p.shot) + '" alt="" loading="lazy"></span>';
      } else {
        // Кадра нет — рисуем пятно, а не пустую рамку: пустая читается как поломка.
        shot = '<span class="proto-shot proto-shot--plate"></span>';
      }
      var go = !p.url ? 'Адреса пока нет' : (p.open ? 'Открыть &rarr;' : 'Ввести пароль &rarr;');
      var body = '<span class="proto-body">'
        + '<span class="proto-meta"><b>' + esc(p.kind) + '</b><i>' + esc(p.when) + '</i></span>'
        + '<h4>' + esc(p.title) + '</h4>'
        + '<p>' + esc(p.desc) + '</p>'
        + '<span class="proto-go">' + go + '</span>'
        + '</span>';
      var cls = 'proto-card' + (p.open ? '' : ' proto-card--locked') + (p.url ? '' : ' proto-card--soon');
      var style = p.tint ? ' style="--tint:' + esc(p.tint) + '"' : '';
      // Без адреса это не ссылка: кликабельная карточка в никуда обманывает.
      if (!p.url) return '<div class="' + cls + '"' + style + '>' + shot + body + '</div>';
      return '<a class="' + cls + '"' + style + ' href="' + esc(p.url) + '"'
        + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + shot + body + '</a>';
    }).join('');

    var live = SHOWN.filter(function(p){ return p.url; }).length;
    document.getElementById('protoCount').textContent = live + ' из ' + SHOWN.length + ' в сети';
  })();
  </script>
</body>
</html>
