<script>
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('bc_lang') || 'ru';
const t = k => (I18N[lang][k] || k);

function card(p){
  const tag = p.tag ? `<span class="card__tag">${p.tag==='new'?(lang==='ru'?'НОВОЕ':'NEW'):p.tag.toUpperCase()}</span>` : '';
  return `<a class="card" href="product.html?p=${p.slug}">
    <div class="card__media">${tag}
      <img src="${BASE}${p.img}" alt="${p.name[lang]}" loading="lazy">
      <div class="card__add">${t('add_cart')}</div>
    </div>
    <div class="card__info">
      <div class="card__l">
        <div class="card__name">${p.name[lang]}</div>
        <div class="card__cat">${p.cat[lang]}</div>
      </div>
      <div class="card__price">${p.price}</div>
    </div></a>`;
}
function renderProducts(){
  document.getElementById('grid-drop').innerHTML = PRODUCTS.filter(p=>p.drop).map(card).join('');
  document.getElementById('grid-all').innerHTML = PRODUCTS.map(card).join('');
}
/* ---- scroll-reactive marquee ---- */
let mP1=0,mP2=0,mHalf1=0,mHalf2=0,mLastY=window.scrollY,mVel=0,mRAF=false;
function buildStrip(){
  const phrase = lang==='ru'
    ? 'ДИСЦИПЛИНА — ХАРАКТЕР — БРАТСТВО — ТИХАЯ СИЛА — '
    : 'DISCIPLINE — CHARACTER — BROTHERHOOD — QUIET STRENGTH — ';
  const unit = phrase.repeat(6);
  const s1=document.getElementById('strip1'), s2=document.getElementById('strip2');
  s1.textContent = unit+unit; s2.textContent = unit+unit;
  mHalf1 = s1.scrollWidth/2; mHalf2 = s2.scrollWidth/2;
  mP1 = 0; mP2 = -mHalf2;
}
function scrollPos(){return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;}
function stripTick(){
  const y = scrollPos();
  let dy = y - mLastY; mLastY = y;
  if(dy>70) dy=70; if(dy<-70) dy=-70;
  mVel += (dy - mVel)*0.25;            // smooth scroll velocity
  const speed = 0.45 + mVel*0.9;        // base drift + scroll boost
  mP1 -= speed; mP2 += speed;
  if(mHalf1){ if(mP1<=-mHalf1) mP1+=mHalf1; if(mP1>=0) mP1-=mHalf1; }
  if(mHalf2){ if(mP2>=0) mP2-=mHalf2; if(mP2<=-mHalf2) mP2+=mHalf2; }
  const s1=document.getElementById('strip1'), s2=document.getElementById('strip2');
  if(s1) s1.style.transform='translate3d('+mP1+'px,0,0)';
  if(s2) s2.style.transform='translate3d('+mP2+'px,0,0)';
  // hero headline parallax — lines slide apart on scroll
  const sh=Math.min(y,900)*0.22;
  const a=document.getElementById('hl1'), b=document.getElementById('hl2');
  if(a) a.style.transform='translate3d('+(-sh)+'px,0,0)';
  if(b) b.style.transform='translate3d('+(sh)+'px,0,0)';
  requestAnimationFrame(stripTick);
}
function startStrip(){ if(!mRAF){ mRAF=true; requestAnimationFrame(stripTick); } }
/* ---- 3D orbiting text ---- */
function buildOrbit(){
  const tot=document.getElementById('tot'); if(!tot) return;
  const text = lang==='ru' ? 'НЕ СЛЕДУЙ · СОЗДАВАЙ · ' : 'DON\u2019T FOLLOW · FORGE · ';
  const chars=[...text];
  const N=chars.length, dur=14;
  function makeLayer(){
    const L=document.createElement('div'); L.className='tot__layer';
    chars.forEach((ch,i)=>{
      const tr=document.createElement('div'); tr.className='tot__tread';
      tr.style.animationDelay=(-(((N-1-i)/N))*dur).toFixed(3)+'s';
      const w=document.createElement('div'); w.className='tot__tread-window';
      w.setAttribute('data-text', ch===' ' ? '\u00A0' : ch);
      tr.appendChild(w); L.appendChild(tr);
    });
    return L;
  }
  tot.innerHTML='';
  tot.appendChild(makeLayer());
  tot.appendChild(makeLayer());
}
/* ---- hero background — cross-fading B&W photo slideshow ---- */
const HERO_IMAGES = ['hero-1.jpg','hero-3.jpg','hero-4.jpg','hero-5.jpg','hero-6.jpg','hero-7.jpg','hero-8.jpg'];
const HERO_FALLBACK = ['hero-bg.jpg','hero-bg-2.jpg','hero-bg-3.jpg'];
function initHeroBg(){
  const bg=document.getElementById('heroBg'); if(!bg||bg.dataset.init) return;
  bg.dataset.init='1';
  const slides=HERO_IMAGES.map((src,i)=>{
    const im=document.createElement('img');
    im.className='slide'+(i===0?' on':'');
    im.alt=''; im.loading=i===0?'eager':'lazy';
    im.onerror=()=>{ im.onerror=null; im.src=HERO_FALLBACK[i%HERO_FALLBACK.length]; };
    im.src=src;
    bg.appendChild(im); return im;
  });
  if(slides.length<2) return;
  let idx=0;
  setInterval(()=>{
    slides[idx].classList.remove('on');
    idx=(idx+1)%slides.length;
    slides[idx].classList.add('on');
  },5200);
}
window.addEventListener('load', ()=>{buildStrip();buildOrbit();initHeroBg();});
window.addEventListener('resize', ()=>{buildStrip();buildOrbit();});
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.getAttribute('data-i18n')).replace(/\n/g,'<br>'));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.getAttribute('data-i18n-ph')));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  const ht=document.getElementById('heroTitle');
  if(ht){ht.innerHTML=t('hero_title').split('\n').map((l,i)=>`<span class="hl" id="hl${i+1}">${l}</span>`).join('');}
  const rt=document.getElementById('ringText');
  if(rt){rt.textContent = lang==='ru'
    ? 'BOXING CARTEL — ДИСЦИПЛИНА В ЧЁРНОМ — НЕ СЛЕДУЙ. СОЗДАВАЙ. — '
    : 'BOXING CARTEL — DISCIPLINE YOU WEAR IN BLACK — DON’T FOLLOW. FORGE. — ';}
  buildOrbit();
  buildStrip();startStrip();renderProducts();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('bc_lang',lang);applyLang();});

function closeModal(){document.getElementById('modal').classList.remove('open');}
function toggleMenu(o){document.getElementById('mmenu').classList.toggle('open',o);}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');}else if(e.target.classList.contains('statement')){e.target.classList.remove('in');}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

applyLang();
