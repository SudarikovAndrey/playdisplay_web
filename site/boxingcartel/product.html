      <div><h4 data-i18n="foot_info"></h4><ul>

        <li><a href="#" data-i18n="foot_delivery"></a></li>
        <li><a href="#" data-i18n="foot_returns"></a></li>

      <div><h4 data-i18n="foot_contact"></h4><ul>

<div class="mmenu" id="mmenu">
  <div class="mmenu__top"><span class="logo">BC</span><button class="modal__close" onclick="toggleMenu(false)">&times;</button></div>
  <a href="index.html#drop" data-i18n="nav_drop"></a>
  <a href="index.html#collection" data-i18n="nav_shop"></a>
  <a href="index.html#philosophy" data-i18n="nav_philo"></a>
  <a href="index.html#contact" data-i18n="nav_contact"></a>
</div>

<div class="modal" id="modal">
  <div class="modal__box">
    <button class="modal__close" onclick="closeModal()">&times;</button>
    <h3 data-i18n="order_title"></h3>
    <p class="prod" id="modal-prod"></p>
    <form onsubmit="event.preventDefault();closeModal();alert(t('order_done'))">
      <label data-i18n="order_name"></label><input type="text" required>
      <label data-i18n="order_phone"></label><input type="tel" required>
      <label data-i18n="order_size"></label><select id="modal-size"></select>
      <button class="btn" type="submit" data-i18n="order_send"></button>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script>
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('bc_lang') || 'ru';
const t = k => (I18N[lang][k] || k);
const slug = new URLSearchParams(location.search).get('p');
let product = PRODUCTS.find(p=>p.slug===slug) || PRODUCTS[0];
let activeSize = null;

function card(p){
  const tag = p.tag ? `<span class="card__tag">${p.tag==='new'?(lang==='ru'?'НОВОЕ':'NEW'):p.tag.toUpperCase()}</span>` : '';
  return `<a class="card" href="product.html?p=${p.slug}">
    <div class="card__media">${tag}
      <img src="${BASE}${p.img}" alt="${p.name[lang]}" loading="lazy">
      <div class="card__add">${t('add_cart')}</div>
    </div>
    <div class="card__info">
      <div class="card__l">
        <div class="card__name">${p.name[lang]}</div>
        <div class="card__cat">${p.cat[lang]}</div>
      </div>
      <div class="card__price">${p.price}</div>
    </div></a>`;
}

function renderPDP(){
  const p = product;
  document.title = `${p.name[lang]} — Boxing Cartel`;
  const thumbs = p.gallery.length>1
    ? `<div class="pdp__thumbs">${p.gallery.map((g,i)=>`<div class="t${i===0?' active':''}" onclick="setShot('${g}',this)"><img src="${BASE}${g}" alt=""></div>`).join('')}</div>` : '';
  document.getElementById('pdp').innerHTML = `
    <a class="pdp__back" href="index.html#collection">${t('pdp_back')}</a>
    <div class="crumb">
      <a href="index.html">${t('crumb_home')}</a><span>/</span>
      <a href="index.html#collection">${t('crumb_shop')}</a><span>/</span>
      <a href="#">${p.name[lang]}</a>
    </div>
    <div class="pdp__main">
      <div class="pdp__gallery">
        <div class="pdp__shot"><img id="main-shot" src="${BASE}${p.gallery[0]}" alt="${p.name[lang]}"></div>
        ${thumbs}
      </div>
      <div class="pdp__info">
        <div class="pdp__cat">${p.cat[lang]}</div>
        <h1 class="pdp__name">${p.name[lang]}</h1>
        <div class="pdp__price">${p.price}</div>
        <p class="pdp__short">${p.short[lang]}</p>
        <div class="pdp__lbl">${t('pdp_sizes')}</div>
        <div class="sizes">${p.sizes.map(s=>`<button onclick="pickSize('${s}',this)">${s}</button>`).join('')}</div>
        <button class="btn pdp__order" onclick="openOrder()">${t('pdp_order')}</button>
        <div class="pdp__ships">${t('pdp_ships')}</div>
        <p class="pdp__desc">${p.desc[lang]}</p>
        <div class="pdp__specs"><h4>${t('pdp_specs')}</h4><ul>${p.specs[lang].map(s=>`<li>${s}</li>`).join('')}</ul></div>
      </div>
    </div>`;
  // related
  const related = PRODUCTS.filter(x=>x.slug!==p.slug && x.cat.en===p.cat.en).slice(0,4);
  const pool = related.length ? related : PRODUCTS.filter(x=>x.slug!==p.slug).slice(0,4);
  document.getElementById('grid-related').innerHTML = pool.map(card).join('');
  document.getElementById('related-sec').style.display = pool.length ? 'block' : 'none';
}
function setShot(img,el){
  document.getElementById('main-shot').src = BASE+img;
  document.querySelectorAll('.pdp__thumbs .t').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
function pickSize(s,el){
  activeSize=s;
  document.querySelectorAll('.sizes button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function openOrder(){
  document.getElementById('modal-prod').textContent = `${product.name[lang]} — ${product.price}`;
  const sel=document.getElementById('modal-size');
  sel.innerHTML = product.sizes.map(s=>`<option${s===activeSize?' selected':''}>${s}</option>`).join('');
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function toggleMenu(o){document.getElementById('mmenu').classList.toggle('open',o);}

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.getAttribute('data-i18n')).replace(/\n/g,'<br>'));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  renderPDP();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('bc_lang',lang);activeSize=null;applyLang();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

applyLang();
</script>
</body>
</html>
