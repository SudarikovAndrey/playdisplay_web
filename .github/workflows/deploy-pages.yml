# Надёжный деплой сайта на GitHub Pages.
# Триггерится на КАЖДЫЙ пуш в proto-3d (в отличие от «Deploy from a branch»,
# который троттлится при частых пушах). Публикует содержимое папки site/.
# Требование (один раз): Settings → Pages → Source: «GitHub Actions».
name: Deploy site to Pages

# ОТКЛЮЧЁН 29.07.2026. Доставка на боевой хостинг идёт напрямую с Мака
# через ./deploy.sh (rsync), GitHub в ней не участвует. Автотриггер на пуш
# в proto-3d снят: он висел на неиспользуемой ветке и всё равно не срабатывал.
# Оставлен как заготовка — если превью на GitHub Pages понадобится снова,
# запускать кнопкой Run workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
